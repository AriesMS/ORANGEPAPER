<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aries Yang / Research Construct</title>
<meta name="description" content="An interactive three-dimensional construct of Aries Yang's research journey.">
<link rel="stylesheet" href="styles/journey.css?v=8">
<script src="scripts/journey.js?v=13" defer></script>
<link rel="stylesheet" href="styles/typography.css?v=1">
</head>
<body>
<main id="projects">
<h1 class="construct-title">Aries' Phd Construct</h1>
<canvas id="construct" tabindex="0" aria-label="Research construct. Drag to rotate; scroll or pinch to zoom. Hover over a geometry for details; Click or tap to keep colours visible; click empty space to clear selection. Use arrow keys to rotate, plus and minus to zoom, and Enter to cycle through fragments. Escape closes details."></canvas>
<aside class="inspector" hidden aria-label="Selected research fragment">
<button id="close-detail" aria-label="Close project details">&times;</button>
<div id="detail" aria-live="polite" aria-atomic="true"></div>
</aside>
</main>
</body>
</html>
